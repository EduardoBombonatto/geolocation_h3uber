# Configuração para usar Postgres real nos testes
spring.datasource.url=jdbc:postgresql://localhost:5433/h3_geo_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Habilita o Hibernate para criar as tabelas no Postgres real (e apagar no fim se usar create-drop)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configura o Docker Compose Support do Spring Boot
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.profiles.active=test
